services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: task-queue:dev
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:example@db:5432/postgres
      REDIS_HOST: redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: task-queue:dev
    command: ["sh", "-c", "exec python -m worker.worker $$(hostname)"]
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:example@db:5432/postgres
      REDIS_HOST: redis
    deploy:
      replicas: 3